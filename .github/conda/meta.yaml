{% set version = environ.get('VERSION_NUMBER', '1.5.0') %}
{% set build = environ.get('BUILD_NUMBER', "0") %}

package:
  name: clingo-lpx
  version: {{ version }}

source:
  path: ../..

requirements:
  build:
  - cmake
  - ninja
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  host:
  - pytest
  - python
  - clingo>=6
  - libflint
  run:
  - python
  - {{ pin_compatible('clingo', max_pin='x.x') }}
  - libflint

build:
  number: {{ build }}

test:
  commands:
  - clingo-lpx --version
  - python -c "import clingolpx"

about:
  home: https://potassco.org/
  license: MIT
  summary: A solver for logic programs with linear constraints.
  description: The clingo-lpx solver extends the clingo ASP system with support for linear constraints over reals.
  license_file: LICENSE.md
  doc_url: https://potassco.org/
  dev_url: https://github.com/potassco/clingo-lpx
